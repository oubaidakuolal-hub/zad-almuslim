      <a href="./azkar-evening.html">المساء</a>

<main class="wrap" style="padding:40px 0">
  <div class="section-head">
    <h2>📜 الأربعون النووية</h2>
    <p>اضغط على أي حديث لقراءة نصه كاملاً</p>
  </div>

  <div class="search-box">
    <input type="search" id="hadithSearch" placeholder="ابحث في الأحاديث..." aria-label="بحث">
  </div>

  <div class="hadith-grid" id="hadithGrid"></div>
</main>

<footer>
  <div class="wrap">
    <div class="footer-inner">
      <div><h4>زاد عبيدة</h4><p>محتوى إسلامي نافع مع توضيح المصادر.</p></div>
      <div><h4>روابط</h4><p><a href="./index.html">الرئيسية</a><br><a href="./adhkar.html">الأذكار</a><br><a href="./quran.html">القرآن</a></p></div>
      <div><h4>تواصل</h4><p>إنستغرام</p></div>
    </div>
    <div class="footer-bottom">© <span id="year"></span> زاد عبيدة</div>
  </div>
</footer>

<!-- مودال الحديث -->
<div class="modal" id="hadithModal" hidden role="dialog" aria-modal="true">
  <div class="modal-dialog">
    <div class="modal-head">
      <h2 id="hadithModalTitle">نص الحديث</h2>
      <button class="modal-close" id="hadithClose" type="button">إغلاق ✕</button>
    </div>
    <div id="hadithModalText" class="modal-body" dir="rtl"></div>
    <a id="hadithSource" class="modal-source" href="https://sunnah.com/nawawi40" target="_blank" rel="noopener noreferrer">المصدر ↗</a>
  </div>
</div>

<div id="google_translate_element" style="position:fixed;left:-10000px;top:0;width:1px;height:1px;overflow:hidden" aria-hidden="true"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<button class="back-to-top" id="backToTop" type="button" aria-label="العودة للأعلى">↑</button>

<script src="./assets/data.js"></script>
<script src="./assets/app.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

(function(){
  const grid = document.getElementById('hadithGrid');
  if(!grid || typeof NAWAWI_HADITHS === 'undefined') return;

  const modal = document.getElementById('hadithModal');
  const modalTitle = document.getElementById('hadithModalTitle');
  const modalText = document.getElementById('hadithModalText');
  const modalSource = document.getElementById('hadithSource');
  const modalClose = document.getElementById('hadithClose');

  NAWAWI_HADITHS.forEach((item, i) => {
    const card = document.createElement('article');
    card.className = 'hadith-card';

    const badge = document.createElement('span');
    badge.className = 'hadith-badge';
    badge.textContent = 'الحديث ' + (i + 1);

    const h3 = document.createElement('h3');
    h3.textContent = item.title;

    const p = document.createElement('p');
    p.textContent = item.text;

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'hadith-open';
    btn.textContent = 'اقرأ كاملاً';

    btn.addEventListener('click', () => {
      modalTitle.textContent = item.title;
      modalText.textContent = item.text;
      modalSource.href = 'https://sunnah.com/nawawi40/' + (i + 1);
      modal.hidden = false;
      document.body.style.overflow = 'hidden';
      modalClose.focus();
    });

    card.append(badge, h3, p, btn);
    grid.appendChild(card);
  });

  function closeModal(){
    modal.hidden = true;
    document.body.style.overflow = '';
  }
  modalClose.addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if(e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && !modal.hidden) closeModal(); });

  const search = document.getElementById('hadithSearch');
  if(search){
    search.addEventListener('input', () => {
      const q = search.value.trim().toLowerCase();
      document.querySelectorAll('.hadith-card').forEach(c => {
        const txt = c.textContent.toLowerCase();
        c.style.display = (!q || txt.includes(q)) ? '' : 'none';
      });
    });
  }
})();
</script>
</body>
</html>
