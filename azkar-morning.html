<main class="wrap" style="padding:40px 0">
  <div class="section-head">
    <h2>🌅 أذكار الصباح</h2>
    <p>تبدأ يومك بذكر الله — تُقال بعد الفجر إلى الضحى</p>
  </div>

  <div class="search-box">
    <input type="search" id="azkarSearch" placeholder="ابحث..." aria-label="بحث">
  </div>

<footer>
  <div class="wrap">
    <div class="footer-inner">

      <div><h4>روابط</h4><p><a href="./index.html">الرئيسية</a><br><a href="./adhkar.html">الأذكار</a><br><a href="./azkar-evening.html">أذكار المساء</a></p></div>
      <div><h4>تواصل</h4><p>إنستغرام</p></div>
    </div>
    <div class="footer-bottom">© <span id="year"></span> زاد عبيدة</div>
  </div>
</footer>

<div id="google_translate_element" style="position:fixed;left:-10000px;top:0;width:1px;height:1px;overflow:hidden" aria-hidden="true"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<button class="back-to-top" id="backToTop" type="button" aria-label="العودة للأعلى">↑</button>

<script src="./assets/data.js"></script>
<script src="./assets/app.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

(function(){
  const list = document.getElementById('azkarList');
  if(!list || typeof AZKAR_MORNING === 'undefined') return;

  const KEY = 'zad_counts_v2';
  function loadC(){ try { return JSON.parse(localStorage.getItem(KEY)||'{}'); } catch { return {}; } }
  function saveC(c){ try { localStorage.setItem(KEY, JSON.stringify(c)); } catch {} }
  const counts = loadC();

  AZKAR_MORNING.forEach(z => {
    const card = document.createElement('article');
    card.className = 'azkar-item';
    card.id = 'dhikr-' + z.id;

    const h3 = document.createElement('h3');
    h3.textContent = z.title;

    const text = document.createElement('div');
    text.className = 'azkar-text';
    text.textContent = z.text;

    const ref = document.createElement('div');
    ref.className = 'azkar-ref';
    ref.textContent = z.ref || '';

    const actions = document.createElement('div');
    actions.className = 'azkar-actions';

    const bCopy = document.createElement('button');
    bCopy.type='button'; bCopy.className='action-btn'; bCopy.textContent='📋 نسخ';
    const bSpeak = document.createElement('button');
    bSpeak.type='button'; bSpeak.className='action-btn'; bSpeak.textContent='🔊 استماع';
    const bShare = document.createElement('button');
    bShare.type='button'; bShare.className='action-btn'; bShare.textContent='📤 مشاركة';
    const bCount = document.createElement('button');
    bCount.type='button'; bCount.className='action-btn primary'; bCount.textContent='+ عدّ';
    const badge = document.createElement('span');
    badge.className='count-badge'; badge.textContent = (counts[z.id]||0) + ' / ' + z.target;
    const bReset = document.createElement('button');
    bReset.type='button'; bReset.className='action-btn'; bReset.textContent='إعادة';

    actions.append(bCopy, bSpeak, bShare, bCount, badge, bReset);
    card.append(h3, text, ref, actions);
    list.appendChild(card);

    bCopy.addEventListener('click', async ()=>{ try { await copyText(z.text); showToast('تم النسخ ✓'); } catch { showToast('تعذّر النسخ'); } });
    bSpeak.addEventListener('click', ()=> speak(z.text));
    bShare.addEventListener('click', ()=> shareContent({ title: z.title, text: z.text, url: location.origin + '/azkar-morning.html#dhikr-' + z.id }));
    bCount.addEventListener('click', ()=>{
      const cur = counts[z.id] || 0;
      if(cur >= z.target) return;
      counts[z.id] = cur + 1; saveC(counts);
      badge.textContent = counts[z.id] + ' / ' + z.target;
      if(counts[z.id] >= z.target){ badge.classList.add('done'); showToast('اكتمل ✓'); }
    });
    bReset.addEventListener('click', ()=>{
      delete counts[z.id]; saveC(counts);
      badge.textContent = '0 / ' + z.target;
      badge.classList.remove('done');
    });

    if((counts[z.id]||0) >= z.target) badge.classList.add('done');
  });

  const search = document.getElementById('azkarSearch');
  if(search){
    search.addEventListener('input', ()=>{
      const q = search.value.trim().toLowerCase();
      document.querySelectorAll('.azkar-item').forEach(c=>{
        const txt = c.textContent.toLowerCase();
        c.style.display = (!q || txt.includes(q)) ? '' : 'none';
      });
    });
  }
})();
</script>
</body>
</html>
