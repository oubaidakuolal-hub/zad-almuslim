<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  /* بناء قائمة الأذكار */
  (function renderAzkar(){
    const list = document.getElementById('azkarList');
    if(!list || typeof ADHKAR === 'undefined') return;
    const counts = loadCounts();

    ADHKAR.forEach(z => {
      const card = document.createElement('article');
      card.className = 'azkar-item';
      card.dataset.id = z.id;
      card.dataset.category = z.category;
      card.dataset.target = z.target;
      card.id = 'dhikr-' + z.id;

      card.innerHTML = `
        <h3>${z.title}</h3>
        <div class="azkar-text">${z.text}</div>
        <div class="azkar-ref">${z.ref}</div>
        <div class="azkar-actions">
          <button class="action-btn" data-action="copy">📋 نسخ</button>
          <button class="action-btn" data-action="speak">🔊 استماع</button>
          <button class="action-btn" data-action="share">📤 مشاركة</button>
          <button class="action-btn primary" data-action="count">+ عدّ</button>
          <span class="count-badge">${(counts[z.id]||0)} / ${z.target}</span>
          <button class="action-btn" data-action="reset">إعادة</button>
        </div>
      `;

      const badge = card.querySelector('.count-badge');
      const paint = ()=>{
        const c = counts[z.id] || 0;
        badge.textContent = c + ' / ' + z.target;
        if(c >= z.target) badge.classList.add('done');
        else badge.classList.remove('done');
      };

      card.addEventListener('click', async (e)=>{
        const btn = e.target.closest('[data-action]');
        if(!btn) return;
        const action = btn.dataset.action;
        if(action === 'copy'){
          try { await copyText(z.text); showToast('تم النسخ ✓'); } catch { showToast('تعذّر النسخ'); }
        } else if(action === 'speak'){
          speak(z.text);
        } else if(action === 'share'){
          const url = location.origin + '/adhkar.html#dhikr-' + z.id;
          shareContent({ title: z.title, text: z.text, url });
        } else if(action === 'count'){
          if((counts[z.id]||0) >= z.target) return;
          counts[z.id] = (counts[z.id]||0) + 1;
          saveCounts(counts);
          paint();
          if(counts[z.id] >= z.target) showToast('اكتمل ✓');
        } else if(action === 'reset'){
          delete counts[z.id];
          saveCounts(counts);
          paint();
        }
      });

      paint();
      list.appendChild(card);
    });

    /* الفلترة */
    document.querySelectorAll('#dhikrFilters .filter-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('#dhikrFilters .filter-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        const f = btn.dataset.filter;
        document.querySelectorAll('.azkar-item').forEach(card=>{
          card.style.display = (f === 'all' || card.dataset.category === f) ? '' : 'none';
        });
      });
    });

    /* البحث */
    const search = document.getElementById('azkarSearch');
    if(search){
      search.addEventListener('input', ()=>{
        const q = search.value.trim().toLowerCase();
        document.querySelectorAll('.azkar-item').forEach(card=>{
          const txt = card.textContent.toLowerCase();
          card.style.display = (!q || txt.includes(q)) ? '' : 'none';
        });
      });
    }

    /* إذا كان هناك hash، انتقل إليه */
    if(location.hash){
      setTimeout(()=>{
        const target = document.querySelector(location.hash);
        if(target){
          target.scrollIntoView({behavior:'smooth', block:'center'});
          target.style.boxShadow = '0 0 0 3px var(--accent)';
          setTimeout(()=>target.style.boxShadow = '', 2600);
        }
      }, 300);
    }
  })();
</script>
