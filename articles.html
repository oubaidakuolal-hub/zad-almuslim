      <p>بر الوالدين من أعظم القربات إلى الله تعالى، وهو حق أوجبه الله على الأبناء، وقرنه بحقه سبحانه في كتابه الكريم. قال الله تعالى: ﴿وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا﴾ [الإسراء: 23].</p>
      <h3>فضل البر وعظم أجره</h3>
      <p>جاء رجل إلى النبي ﷺ فقال: "يا رسول الله، من أحق الناس بحسن صحابتي؟" قال: «أمك»، قال: ثم من؟ قال: «أمك»، قال: ثم من؟ قال: «أمك»، قال: ثم من؟ قال: «أبوك» (متفق عليه). وقد بيّن العلماء أن للأم ثلاثة أضعاف ما للأب من البر، لصعوبة الحمل والوضع والرضاع [citation:1].</p>
      <p>وقال ﷺ: «من أصبح مطيعاً لله في والديه أصبح له بابان مفتوحان من الجنة، وإن كان واحداً فواحد، ومن أمسى عاصياً لله في والديه أصبح له بابان مفتوحان من النار» [citation:7].</p>
      <h3>البر بعد الموت</h3>

      <p><strong>الخلاصة:</strong> بر الوالدين عبادة عظيمة، وطريق مختصر إلى الجنة، فلا تفرط فيهما في حياتهما ولا بعد مماتهما.</p>

      <p>الشكر هو الاعتراف بنعم الله تعالى، واستعمالها في طاعته. وهو عبادة عظيمة قرنها الله بذكره، فقال تعالى: ﴿فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ﴾ [البقرة: 152].</p>
      <h3>أهمية الشكر</h3>
      <p>قال تعالى: ﴿لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ﴾ [إبراهيم: 7]. فالشكر سبب لزيادة النعم. وقال النبي ﷺ لمعاذ: «يا معاذ، والله إني لأحبك، فلا تدعن في دبر كل صلاة أن تقول: اللهم أعني على ذكرك وشكرك وحسن عبادتك» (رواه أبو داود).</p>
      <h3>كيف تشكر الله؟</h3>
      <ul>
        <li><strong>بالقلب:</strong> أن تعترف بأن كل نعمة من الله وحده.</li>
        <li><strong>باللسان:</strong> أن تقول "الحمد لله" و"الشكر لله" في كل حال.</li>
        <li><strong>بالعمل:</strong> أن تستعمل نعم الله في طاعته، لا في معصيته.</li>
      </ul>
      <p><strong>الخلاصة:</strong> من عرف نعمة الله شكره، ومن شكره زاده الله. فاجعل لسانك رطباً بالحمد والشكر.</p>
    `
  }
};

(function(){
  const grid = document.getElementById('articlesGrid');
  if(!grid || !MY_ARTICLES) return;

  const modal = document.getElementById('articleModal');
  const modalTitle = document.getElementById('articleModalTitle');
  const modalBody = document.getElementById('articleModalBody');
  const modalClose = document.getElementById('articleClose');

  // إنشاء البطاقات
  Object.keys(MY_ARTICLES).forEach(key => {
    const article = MY_ARTICLES[key];
    const card = document.createElement('article');
    card.className = 'card article-card';

    const top = document.createElement('div');
    top.className = 'article-top';
    const pill = document.createElement('span');
    pill.className = 'pill';
    pill.textContent = article.category;
    top.appendChild(pill);

    const h3 = document.createElement('h3');
    h3.textContent = article.title;

    const p = document.createElement('p');
    // إزالة وسوم HTML لعرض مقتطف
    p.textContent = article.body.replace(/<[^>]+>/g, '').slice(0, 120) + '…';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'action-btn primary';
    btn.textContent = 'اقرأ المقال ←';
    btn.style.marginTop = '12px';

    btn.addEventListener('click', () => {
      modalTitle.textContent = article.title;
      modalBody.innerHTML = article.body;
      modal.hidden = false;
      document.body.style.overflow = 'hidden';
      modalClose.focus();
    });

    card.append(top, h3, p, btn);
    grid.appendChild(card);
  });

  function closeModal(){
    modal.hidden = true;
    document.body.style.overflow = '';
  }
  modalClose.addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if(e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && !modal.hidden) closeModal(); });
})();
</script>
</body>
</html>
